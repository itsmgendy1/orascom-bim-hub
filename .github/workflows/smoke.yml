name: smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Hub scripts
        run: node --check assets/js/hub.js && node --check assets/js/ohub-auth.js && node --check assets/js/site-plots.js && node --check assets/js/forma.js
      - name: Headless view smoke suite
        run: node tests/smoke_views.js
      - name: Validator fixture suite
        run: node tests/validators_ws.js
      - name: Parameter kernel suite
        run: node tests/validators_pm.js
      - name: Naming segment suite
        run: node tests/validators_naming.js
      - name: Clash engine suite
        run: node tests/validators_clash.js
      - name: Delivery kernel suite
        run: node tests/validators_dv.js
      - name: Model-quality kernel suite
        run: node tests/validators_mq.js
      - name: Hub shell suite
        run: node tests/hub_shell.js
      - name: Role gating suite
        run: node tests/role_gating.js
      - name: Scoring and persistence suite
        run: node tests/validators_mq2.js
      - name: QAQC checklist fill suite
        run: node tests/validators_qaqc.js
      - name: Perf gates
        run: node tests/perf_gates.js
